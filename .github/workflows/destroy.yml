name: Destroy do staging

# Derruba o banco de staging ao fim de cada janela de avaliação, para não
# queimar o crédito do lab. Só staging: em produção o `deletion_protection` faz
# a própria API do RDS recusar a exclusão.
#
# A ordem entre repositórios é a inversa da criação: derrube antes a Lambda de
# staging. Enquanto ela carregar o SG de cliente, a AWS recusa apagá-lo e o
# destroy para no meio com DependencyViolation.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite "staging" para confirmar'
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_log_forwarder_arn: ${{ vars.LOG_FORWARDER_ARN }}
  TF_VAR_alarm_actions: ${{ vars.ALARM_ACTIONS || '[]' }}

jobs:
  destroy:
    name: Destroy
    if: inputs.confirmar == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: envs/staging

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Credenciais AWS (OIDC ou lab)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-access-key-id: ${{ secrets.AWS_LAB_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_LAB_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_LAB_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # O run fica como registro do que foi derrubado. `terraform show` mascara
      # os valores sensíveis, então a senha não vai para o resumo.
      - name: Plan do destroy no resumo do run
        run: |
          terraform plan -destroy -input=false -no-color -out=tfdestroy
          {
            echo '## Destroy de `staging`'
            echo '```'
            terraform show -no-color tfdestroy
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        run: terraform apply -input=false tfdestroy
