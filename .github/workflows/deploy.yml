name: Deploy

# develop e homolog aplicam envs/staging; main aplica envs/prod.
#
# Dois jobs, para quem aprova produção ver o plan ANTES de aprovar: o `plan`
# roda sem environment e publica o plano no resumo do run; o `apply` usa o
# environment (`staging` ou `production`), cujo gate de revisores segura o job
# antes de ele começar.
on:
  push:
    branches: [develop, homolog, main]
  workflow_dispatch:

# Um apply por ambiente de cada vez, sem cancelar o que está rodando: matar um
# apply no meio deixa o lock do state preso e o RDS no meio de uma modificação.
concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AMBIENTE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_log_forwarder_arn: ${{ vars.LOG_FORWARDER_ARN }}
  TF_VAR_alarm_actions: ${{ vars.ALARM_ACTIONS || '[]' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/${{ env.AMBIENTE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Sem environment, este job lê os secrets do REPOSITÓRIO. É de propósito:
      # com os secrets só no environment `production`, o plan esperaria a mesma
      # aprovação que ele existe para informar. OIDC quando há AWS_DEPLOY_ROLE;
      # no AWS Academy não há como criar a role nem o provider OIDC, então valem
      # as credenciais TEMPORÁRIAS do lab (com session token). Preencha um dos
      # dois conjuntos, nunca os dois: com ambos, a action assume a role usando
      # as chaves do lab.
      - name: Credenciais AWS (OIDC ou lab)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-access-key-id: ${{ secrets.AWS_LAB_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_LAB_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_LAB_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      # Sem a variável, o init pediria o bucket interativamente e falharia com
      # uma mensagem que não diz o que configurar.
      - name: Bucket do state configurado
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Defina a variável TF_STATE_BUCKET (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: O plan não destrói o banco
        run: ../../.github/scripts/conferir-plan.sh tfplan mudancas.json

      # `terraform show` mascara os valores sensíveis, então a senha não vai
      # para o resumo do run.
      - name: Plano no resumo do run
        run: |
          {
            echo "## Plan de \`$AMBIENTE\`"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mudancas-${{ env.AMBIENTE }}
          path: envs/${{ env.AMBIENTE }}/mudancas.json
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: envs/${{ env.AMBIENTE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Credenciais AWS (OIDC ou lab)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-access-key-id: ${{ secrets.AWS_LAB_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_LAB_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_LAB_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mudancas-${{ env.AMBIENTE }}
          path: aprovado

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # O tfplan do job anterior não vem como artifact porque carrega a senha do
      # banco e o repositório é público. Este job planeja de novo e só aplica se
      # o plano for o MESMO que foi aprovado: se algo mudou no state enquanto o
      # gate esperava, o run para em vez de aplicar o que ninguém viu.
      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: O plan não destrói o banco e é o que foi aprovado
        run: |
          ../../.github/scripts/conferir-plan.sh tfplan mudancas.json
          if ! diff -u "$GITHUB_WORKSPACE/aprovado/mudancas.json" mudancas.json; then
            echo "::error::O plan mudou desde o job de plan. Rode o deploy de novo e revise o plano novo."
            exit 1
          fi

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      # O contrato com a Lambda e com o cluster é o prefixo no SSM. Se ele não
      # estiver lá depois do apply, os consumidores quebram longe daqui.
      - name: Conferir o contrato no SSM
        run: |
          prefixo=$(terraform output -raw ssm_prefix)
          for nome in endpoint host port name username password client-sg-id; do
            aws ssm get-parameter --name "$prefixo/$nome" --query Parameter.Name --output text >/dev/null || {
              echo "::error::$prefixo/$nome não foi publicado"; exit 1; }
          done
          echo "Contrato publicado em $prefixo"
