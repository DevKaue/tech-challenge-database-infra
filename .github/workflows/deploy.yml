name: Deploy

# develop e homolog aplicam envs/staging; main aplica envs/prod. O ambiente do
# GitHub (`staging` ou `production`) guarda as credenciais e, em produção, o gate
# de aprovação.
on:
  push:
    branches: [develop, homolog, main]
  workflow_dispatch:

# Um apply por ambiente de cada vez, sem cancelar o que está rodando: matar um
# apply no meio deixa o lock do state preso e o RDS no meio de uma modificação.
concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VAR_log_forwarder_arn: ${{ vars.LOG_FORWARDER_ARN }}
  TF_VAR_alarm_actions: ${{ vars.ALARM_ACTIONS || '[]' }}

jobs:
  deploy:
    name: Plan e apply
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: envs/${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # OIDC quando o environment tem AWS_DEPLOY_ROLE. No AWS Academy não há como
      # criar a role nem o provider OIDC, então valem as credenciais TEMPORÁRIAS
      # do lab (com session token), que expiram com a sessão. Preencha um dos dois
      # conjuntos, nunca os dois: com ambos, a action assume a role usando as
      # chaves do lab.
      - name: Credenciais AWS (OIDC ou lab)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-access-key-id: ${{ secrets.AWS_LAB_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_LAB_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_LAB_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # O critério de aceite é que o plan nunca proponha destruir o banco. Um
      # replace (delete + create) de aws_db_instance apaga os dados mesmo com o
      # apply "dando certo", então o pipeline para antes do apply.
      - name: O plan não destrói o banco
        run: |
          terraform show -json tfplan > plan.json
          destruidos=$(jq -r '(.resource_changes // [])[]
            | select(.type == "aws_db_instance")
            | select(.change.actions | index("delete"))
            | .address' plan.json)
          if [ -n "$destruidos" ]; then
            echo "::error::O plan destrói o banco: $destruidos"
            exit 1
          fi

      - name: Terraform apply
        run: terraform apply -input=false tfplan

      # O contrato com a Lambda e com o cluster é o prefixo no SSM. Se ele não
      # estiver lá depois do apply, os consumidores quebram longe daqui.
      - name: Conferir o contrato no SSM
        run: |
          prefixo=$(terraform output -raw ssm_prefix)
          for nome in endpoint host port name username password client-sg-id; do
            aws ssm get-parameter --name "$prefixo/$nome" --query Parameter.Name --output text >/dev/null || {
              echo "::error::$prefixo/$nome não foi publicado"; exit 1; }
          done
          echo "Contrato publicado em $prefixo"
